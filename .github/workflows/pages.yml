name: Publish dashboard to GitHub Pages

# PC 에서 `publish.bat`(python -m app.publish) 로 만든 docs/ 스냅샷을 그대로 Pages 에 배포합니다.
# (GitHub 호스팅 러너에서는 DART API 응답이 매우 느려 여기서 DART 를 호출하지 않습니다)
# docs/ 가 바뀐 push 마다 자동 실행, 수동 실행도 가능. Pages 설정: Settings → Pages → Source = GitHub Actions

on:
  push:
    branches: [main, master, claude/inspiring-shannon-texink]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

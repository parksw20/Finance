name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main, master, claude/inspiring-shannon-texink]
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: DART 갱신 (DART_API_KEY 시크릿이 있을 때만)
        if: ${{ env.DART_API_KEY != '' }}
        env:
          DART_QUARTERLY: "true"
        run: python -m app.refresh --dart
      - name: 정적 사이트 내보내기
        run: python -m app.export_static site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
